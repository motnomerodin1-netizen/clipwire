name: Build clipwire for iOS 26.1 (A13)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Show SDK
        run: xcrun --sdk iphoneos --show-sdk-path
      - name: Install ldid
        run: brew install ldid
      - name: Build arm64e binary
        run: make
      - name: Apply entitlements
        run: ldid -Sentitlements.plist clipwire
      - name: Upload signed binary
        uses: actions/upload-artifact@v4
        with:
          name: clipwire-signed
          path: clipwire
